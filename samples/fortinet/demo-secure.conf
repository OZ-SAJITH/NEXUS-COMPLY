config system global
    set admin-sport 8443
    set gui-https enable
    set admin-https enable
    set hostname "fgt-corp-01"
end

config system admin
    edit "admin"
        set trusthost1 10.0.0.0/24
        set trusthost2 192.168.10.0/24
        set gui-https enable
        set ssh-public-key1 "ssh-rsa AAAA..."
    next
end

config system snmp community
    edit 1
        set name "monitoring"
        set status enable
        set query-v1 disable
        set query-v2c disable
    next
end

config log syslogd setting
    set status enable
    set server "10.0.0.20"
end

config firewall policy
    edit 1
        set name "mgmt-allow-from-trust"
        set srcintf "trust"
        set dstintf "dmz"
        set srcaddr "trust-net"
        set dstaddr "dmz-net"
        set action accept
        set schedule "always"
        set service "SSH"
    next
end

config vdom
    edit root
    next
end
