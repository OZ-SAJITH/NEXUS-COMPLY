config system global
    set admin-sport 80
    set gui-http enable
    set hostname "fgt-edge-01"
end

config system admin
    edit "admin"
        set trusthost1 0.0.0.0 0.0.0.0
        set gui-http enable
        set password ENC SomeEncryptedPassword
    next
end

config system snmp community
    edit 1
        set name "public"
        set status enable
        set query-v1 enable
        set query-v2c enable
    next
end

config firewall policy
    edit 1
        set name "permit-from-any"
        set srcintf "wan"
        set dstintf "dmz"
        set srcaddr "all"
        set dstaddr "dmz-net"
        set action accept
        set schedule "always"
        set service "SSH"
    next
end

config vdom
    edit root
    next
end
