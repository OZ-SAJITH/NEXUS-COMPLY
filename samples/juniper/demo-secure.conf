system {
    host-name juniper-core-01;
    root-authentication {
        encrypted-password "$6$SecureHash$abC123";
    }
    services {
        ssh {
            root-login allow;
        }
    }
    syslog {
        file messages {
            any notice;
        }
        host 10.0.0.20 {
            info;
        }
    }
}

security {
    zones {
        security-zone trust {
            host-inbound-traffic {
                system-services {
                    ssh;
                }
            }
        }
        security-zone dmz {
        }
    }
    policies {
        from-zone trust to-zone dmz {
            policy allow-mgmt {
                match {
                    source-address trust-net;
                    destination-address dmz-net;
                    application junos-ssh;
                }
                then {
                    permit;
                }
            }
        }
    }
}

snmp {
    community monitoring {
        authorization read-only;
        clients {
            10.0.0.0/24;
        }
    }
}

interfaces {
    ge-0/0/0 {
        unit 0 {
            family inet {
                address 10.0.0.1/24;
            }
        }
    }
    ge-0/0/1 {
        unit 0 {
            family inet {
                address 192.168.10.1/24;
            }
        }
    }
}
