system {
    host-name juniper-edge-01;
    root-authentication {
        plain-text-password "WeakRootPassword";
    }
    services {
        telnet;
        http;
    }
}

security {
    zones {
        security-zone untrust {
        }
        security-zone dmz {
        }
    }
}

snmp {
    community public {
        authorization read-write;
        clients {
            0.0.0.0/0;
        }
    }
}

interfaces {
    ge-0/0/0 {
        unit 0 {
            family inet {
                address 203.0.113.1/24;
            }
        }
    }
}
