# CloudEdge SDN-1200 — partner-managed device (v3 revision)
NODE "ce-edge-partner-8800" {
  ROLE "dmz"
  DATAPLANE "enabled"
}

AUTH.POLICY {
  METHOD "SSH"
  ALLOWED.CLIENTS "0.0.0.0/0"
  KEY.STORAGE "kms://vault/partner"
}

MGMT.ACCESS {
  PROTOCOL "SSH"
  SOURCE "0.0.0.0/0"
  PORT 22
  AUDIT.TRAIL "off"
}

SERVICE "admin-web" {
  PROTOCOL "HTTP"
  BIND "0.0.0.0"
  PORT 8080
}

ZONE "public" {
  NETWORK "203.0.113.0/24"
}

ZONE "core" {
  NETWORK "10.40.0.0/16"
}

ROUTING.POLICY {
  DEFAULT.ACTION "ALLOW"
  PATTERN "permit * any to any"
}

SNMP {
  VERSION "v2c"
  COMMUNITY "public"
  SOURCE.RESTRICT "false"
}