# CloudEdge SDN-1200 — node definition (branch variant)
NODE "ce-edge-branch-2200" {
  ROLE "perimeter"
  DATAPLANE "enabled"
}

AUTH.POLICY {
  METHOD "SSH"
  ALLOWED.CLIENTS "0.0.0.0/0"
  KEY.STORAGE "kms://vault/branch"
}

MGMT.ACCESS {
  PROTOCOL "SSH"
  SOURCE "0.0.0.0/0"
  PORT 22
  AUDIT.TRAIL "off"
}

SERVICE "admin-web" {
  PROTOCOL "HTTP"
  BIND "0.0.0.0"
  PORT 8080
}

ZONE "public" {
  NETWORK "198.51.100.0/24"
}

ZONE "core" {
  NETWORK "10.30.0.0/16"
}

ROUTING.POLICY {
  DEFAULT.ACTION "ALLOW"
  PATTERN "permit * any to any"
}

SNMP {
  VERSION "v2c"
  COMMUNITY "private"
  SOURCE.RESTRICT "false"
}
