name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (monorepo root)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies from the workspace root
        run: npm ci

      - name: Build apps/web for GitHub Pages
        run: npm run build --workspace=apps/web
        env:
          GH_PAGES: "true"
          # GitHub Pages is a static host only (no backend, POST /api/* -> 405).
          # If you host the API separately, set the repo variable VITE_API_URL
          # to its origin, e.g. https://nexus-api.example.com
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - name: Verify production build output
        run: |
          test -f apps/web/dist/index.html
          test -f apps/web/dist/404.html

      # The Pages artifact must contain the CONTENTS of apps/web/dist at its
      # ROOT: index.html, assets/, *.png ... (NOT apps/web/dist/... nested).
      # This listing is the proof.
      - name: List artifact payload (root = dist contents)
        run: find apps/web/dist -maxdepth 2 | sort

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Report expected site URL
        run: |
          echo "Expected site URL:"
          echo "https://OZ-SAJITH.github.io/NEXUS-COMPLY/"
          echo "If the URL still shows 'There isn't a GitHub Pages site here'"
          echo "after a green run, enable Pages at:"
          echo "Repo Settings -> Pages -> Build and deployment -> Source: GitHub Actions"